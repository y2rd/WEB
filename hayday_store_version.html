<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Y2rd Store - نموذج أولي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Droid+Arabic+Kufi:wght@400;700&family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    

    :root {
      --bg-body: #f8f9fa;
      --bg-card: #ffffff;
      --text-main: #111827;
      --border-color: #e5e7eb;
      --input-bg: #ffffff;
      --header-bg: rgba(255, 255, 255, 0.98);
      --primary: #6b7d73;
      --chip-bg: #f3f4f6;
    }

    body.dark-mode {
      --bg-body: #111827;
      --bg-card: #1f2937;
      --text-main: #ffffff;
      --border-color: #374151;
      --input-bg: #111827;
      --header-bg: rgba(17, 24, 39, 0.98);
      --primary: #94a3b8;
      --chip-bg: #111827;
    }

    * {
      box-sizing: border-box;
      font-family: 'Tajawal', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif !important;
    }

    body.en-mode {
      font-family: 'Droid Arabic Kufi', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif !important;
    }

    body {
      margin: 0;
      background: var(--bg-body);
      color: var(--text-main);
      font-weight: 800;
      padding-bottom: 120px;
    }

    .ui-hide-content { display: none !important; }
    .row-hidden { display: none !important; }

    header, footer {
      background: var(--header-bg);
      backdrop-filter: blur(10px);
    }

    .machines-slider {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px;
      scrollbar-width: none;
      border-bottom: 1px solid var(--border-color);
    }

    .machines-slider::-webkit-scrollbar { display: none; }

    .machine-filter-btn {
      flex: 0 0 auto;
      padding: 6px 12px;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      color: #111827;
      cursor: pointer;
      transition: 0.15s ease;
    }

    body.dark-mode .machine-filter-btn {
      background: #0f172a;
      color: #fff;
    }

    .machine-filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .compact-input {
      height: 32px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 10px;
      background: var(--input-bg);
      color: var(--text-main);
      outline: none;
      font-weight: 900;
      width: 100%;
      padding: 0 8px;
    }

    .qty-step-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--input-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      height: 32px;
    }

    .qty-step-btn,
    .product-qty-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .qty-step-btn {
      width: 38px;
      height: 100%;
      font-size: 20px;
    }

    .qty-step-btn:hover,
    .product-qty-btn:hover {
      transform: scale(1.05);
    }

    .qty-step-btn:active,
    .product-qty-btn:active {
      opacity: 0.55;
    }

    .qty-step-value {
      flex: 1;
      text-align: center;
      font-size: 11px;
      font-weight: 900;
      user-select: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      letter-spacing: 0.3px;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: end;
    }

    .control-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1 1 150px;
      min-width: 140px;
    }

    .control-block.id-block {
      flex: 1.15 1 170px;
      min-width: 160px;
    }

    .control-block.search-block {
      flex: 1.25 1 190px;
      min-width: 170px;
    }

    .control-block.level-block {
      flex: 1 1 150px;
      min-width: 140px;
    }

    .control-block.step-block {
      flex: 0.7 1 115px;
      min-width: 110px;
    }

    .control-block.target-block {
      flex: 0.75 1 120px;
      min-width: 115px;
    }

    .control-label {
      font-size: 10px;
      opacity: 0.7;
      font-weight: 900;
    }

    .control-block.distribute-block {
      flex: 1 1 300px;
      min-width: 250px;
    }

    .distribute-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .note-box {
      max-width: 56rem;
      margin: 0 auto;
      padding: 0 12px 12px;
      font-size: 11px;
      opacity: 0.75;
    }

    .responsive-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .machine-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 165px;
      position: relative;
      overflow: hidden;
    }

    .level-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      padding: 3px 6px;
      border-radius: 999px;
      line-height: 1;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .product-img-container {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      flex-shrink: 0;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,0.7);
    }

    .product-img,
    .machine-badge-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: transparent;
    }

    .machine-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: rgba(255,255,255,0.96);
      border: 1px solid var(--border-color);
      overflow: hidden;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-name {
      width: 100%;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
      margin-bottom: 6px;
      min-height: 28px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-meta {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 6px;
      min-height: 22px;
    }

    .meta-chip {
      font-size: 8px;
      line-height: 1;
      padding: 3px 5px;
      border-radius: 999px;
      background: var(--chip-bg);
      border: 1px solid var(--border-color);
      font-weight: 900;
      white-space: nowrap;
      color: var(--text-main);
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace !important;
      letter-spacing: 0.3px;
      font-variant-numeric: tabular-nums;
    }

    .qty-box {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
      background: var(--input-bg);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .product-qty-btn {
      width: 32px;
      height: 30px;
      font-size: 16px;
      border-radius: 8px;
    }

    .product-qty-value {
      min-width: 34px;
      text-align: center;
      font-size: 12px;
      font-weight: 900;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      letter-spacing: 0.3px;
    }

    .btn-disabled {
      opacity: 0.35 !important;
      pointer-events: none !important;
      filter: grayscale(1);
    }

    .progress-bar {
      height: 6px;
      border-radius: 999px;
      background: var(--border-color);
      overflow: hidden;
    }

    #progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.25s ease;
    }

    #toggle-ui-btn {
      position: fixed;
      left: 20px;
      bottom: 155px;
      z-index: 250;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.18);
      border: none;
      cursor: pointer;
    }

    @media (max-width: 1024px) {
      .responsive-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (max-width: 768px) {
      body { padding-bottom: 180px; }
      #toggle-ui-btn { left: 14px; bottom: 138px; width: 40px; height: 40px; }
      .responsive-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .control-block,
      .control-block.id-block,
      .control-block.search-block,
      .control-block.level-block,
      .control-block.step-block,
      .control-block.target-block { flex: 1 1 calc(50% - 8px); min-width: 150px; }
      .control-block.distribute-block { flex: 1 1 100%; }
    }

    @media (max-width: 480px) {
      body { padding-bottom: 190px; }
      .compact-input { height: 34px; font-size: 10px; }
      .control-block,
      .control-block.distribute-block {
        min-width: 100%;
        flex: 1 1 100%;
      }
      .responsive-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .machine-card { padding: 8px; min-height: 160px; }
      .product-img-container { width: 40px; height: 40px; }
      .machine-badge { top: 6px; left: 6px; width: 20px; height: 20px; }
      #main-footer { padding: 6px 8px 10px; }
      #footer-collapsible { gap: 6px; }
      #view-list-btn,
      #copy-code-btn,
      #footer-collapsible button {
        height: 40px !important;
        font-size: 10px !important;
      }
      .distribute-row { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
  <button id="toggle-ui-btn" type="button" title="إخفاء أو إظهار الواجهة">
    <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
  </button>

  <header id="main-header" class="sticky top-0 z-[100] border-b border-gray-200 shadow-sm">
    <div id="machines-container" class="machines-slider"></div>

    <div id="header-collapsible" class="max-w-4xl mx-auto p-3 space-y-3">
      <div class="flex justify-between items-center gap-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 bg-[#6b7d73] rounded-lg flex items-center justify-center text-white font-black text-xs">Y2</div>
          <h1 class="text-sm font-black">منتجات إختيارية - نموذج أولي</h1>
        </div>
        <div class="flex items-center gap-2">
          <button id="lang-btn" type="button" class="w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-200 text-[10px] font-black">AR</button>
          <button id="theme-btn" type="button" class="w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-200 text-gray-500">
            <svg id="moon-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
            <svg id="sun-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
          </button>
        </div>
      </div>

      <div class="controls-row w-full pb-1">
        <div class="control-block id-block">
          <span class="control-label">البطاقة التعريفية</span>
          <input type="text" id="user-id" placeholder="#000" class="compact-input text-center uppercase font-bold" />
        </div>

        <div class="control-block search-block">
          <span class="control-label">البحث عن منتج</span>
          <input type="text" id="product-search" placeholder="اسم المنتج..." class="compact-input" />
        </div>

        <div class="control-block level-block">
          <span class="control-label">مستوى المنتجات (من - إلى)</span>
          <div class="flex items-center gap-1">
            <input type="number" id="min-lvl" value="1" min="1" class="compact-input text-center" />
            <span class="opacity-30">-</span>
            <input type="number" id="max-lvl" value="150" min="1" class="compact-input text-center" />
          </div>
        </div>

        <div class="control-block step-block">
          <span class="control-label">الكمية المزاده</span>
          <div class="qty-step-control">
            <button id="step-minus" type="button" class="qty-step-btn">-</button>
            <span id="step-qty" class="qty-step-value">10</span>
            <button id="step-plus" type="button" class="qty-step-btn">+</button>
          </div>
        </div>

        <div class="control-block target-block">
          <span class="control-label">كمية المنتجات</span>
          <select id="target-qty" class="compact-input text-center font-black cursor-pointer">
            <option value="1000">1000</option>
            <option value="2000">2000</option>
            <option value="3000">3000</option>
            <option value="4000">4000</option>
            <option value="5000" selected>5000</option>
            <option value="6000">6000</option>
            <option value="7000">7000</option>
            <option value="8000">8000</option>
            <option value="9000">9000</option>
            <option value="10000">10000</option>
          </select>
        </div>

        <div class="control-block distribute-block">
          
          <div class="distribute-row">
            <select id="distribute-scope" class="compact-input" style="max-width:150px;">
              <option value="visible" selected>المنتجات الظاهرة</option>
              <option value="all">كل المنتجات</option>
            </select>
            <button id="distribute-btn" type="button" title="توزيع الكمية بالتساوي" class="h-[38px] px-3 bg-[#6b7d73] text-white rounded-lg flex items-center justify-center flex-1 font-black text-[12px]" style="border:none;cursor:pointer;min-width:60px;">
              ⚖️
            </button>
          </div>
        </div>
      </div>
    </div>

    
  </header>

  <main class="max-w-4xl mx-auto p-3">
    <div id="grid-container" class="responsive-grid"></div>
  </main>

  <footer id="main-footer" class="fixed bottom-0 left-0 right-0 z-[100] p-2 pb-3 border-t border-gray-200 shadow-2xl">
    <div class="max-w-4xl mx-auto space-y-2">
      <div class="flex justify-between items-center gap-2">
        <div class="flex flex-col">
          <span class="text-[9px] font-black uppercase opacity-60">الكمية المختارة</span>
          <div class="flex items-baseline gap-1">
            <span id="current-total" class="text-xl font-black leading-none mono">0</span>
            <span class="text-xs opacity-50">/ <span id="target-display" class="mono">500</span></span>
          </div>
        </div>
        <div class="progress-bar flex-1" style="height:5px"><div id="progress-fill"></div></div>
        <div class="text-left"><span class="text-[10px] font-black tracking-wider block">Y2RD STORE</span></div>
      </div>

      <div id="footer-collapsible" class="flex gap-2 w-full flex-wrap sm:flex-nowrap">
        <button id="reset-btn" type="button" class="w-10 h-9 bg-white border border-gray-200 rounded-xl flex items-center justify-center flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path></svg>
        </button>
        <button id="view-list-btn" type="button" class="btn-disabled flex-1 h-9 bg-white border border-gray-200 text-black rounded-xl font-black text-[10px]">عرض ملخص الطلب</button>
        <button id="copy-code-btn" type="button" class="btn-disabled flex-1 h-9 bg-white border border-gray-200 text-black font-black text-[10px] rounded-xl">نسخ الطلب</button>
      </div>
    </div>
  </footer>

  <div id="modal-overlay" class="fixed inset-0 bg-[#6b7d73]/70 backdrop-blur-md z-[300] hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl flex flex-col max-h-[85vh]" onclick="event.stopPropagation()">
      <div class="flex justify-between items-start mb-4">
        <h2 class="text-lg font-black">ملخص الطلب</h2>
        <div id="modal-badge-id" class="px-3 py-1 bg-gray-100 rounded-full text-[10px] font-bold"></div>
      </div>
      <div id="list-content" class="space-y-2 overflow-y-auto mb-4 pr-2 text-sm font-black text-right" dir="rtl"></div>
      <div class="border-t pt-4 mt-2">
        <div class="flex justify-between text-xs mb-1"><span class="opacity-60">عدد أنواع المنتجات المختارة:</span><span id="product-count" class="font-black">0</span></div>
        <div class="flex justify-between text-xs mb-3"><span class="opacity-60">إجمالي الكمية:</span><span id="total-qty-modal" class="font-black">0</span></div>
      </div>
      <button id="close-modal-btn" type="button" class="mt-2 w-full py-3 bg-[#6b7d73] text-white rounded-2xl font-black text-sm" style="border:none;cursor:pointer;">إغلاق</button>
    </div>
  </div>

  <script>
    const machineTranslations = {
      Bakery: { ar: 'المخبز', en: 'Bakery' },
      'BBQ Grill': { ar: 'شواية باربكيو', en: 'BBQ Grill' },
      Dairy: { ar: 'الألبان', en: 'Dairy' },
      'Sugar Mill': { ar: 'مطحنة السكر', en: 'Sugar Mill' },
      'Pie Oven': { ar: 'فرن الفطائر', en: 'Pie Oven' },
      'Popcorn Pot': { ar: 'قدر الفشار', en: 'Popcorn Pot' },
      Loom: { ar: 'النول', en: 'Loom' }
    };

    const productData = [
      { name: { en: 'Bread', ar: 'خبز' }, level: 2, machine: 'Bakery', emoji: '🍞', img: 'https://hayday.fandom.com/wiki/Special:FilePath/Bread.png' },
      { name: { en: 'Pancakes', ar: 'فطائر' }, level: 9, machine: 'Bakery', emoji: '🥞', img: 'https://hayday.fandom.com/wiki/Special:FilePath/Pancake.png' },
      { name: { en: 'Cookie', ar: 'كوكيز' }, level: 10, machine: 'Bakery', emoji: '🍪', img: 'https://hayday.fandom.com/wiki/Special:FilePath/Cookie.png' },
      { name: { en: 'Bacon and Eggs', ar: 'بيض ولحم' }, level: 11, machine: 'BBQ Grill', emoji: '🍳', img: 'https://hayday.fandom.com/wiki/Special:FilePath/Bacon_and_Eggs.png' },
      { name: { en: 'Cheese', ar: 'جبن' }, level: 12, machine: 'Dairy', emoji: '🧀', img: 'https://hayday.fandom.com/wiki/Special:FilePath/Cheese.png' },
      { name: { en: 'White Sugar', ar: 'سكر أبيض' }, level: 13, machine: 'Sugar Mill', emoji: '🍚', img: 'https://hayday.fandom.com/wiki/Special:FilePath/White_Sugar.png' },
      { name: { en: 'Carrot Pie', ar: 'فطيرة جزر' }, level: 14, machine: 'Pie Oven', emoji: '🥧', img: 'https://hayday.fandom.com/wiki/Special:FilePath/Carrot_Pie.png' },
      { name: { en: 'Pumpkin Pie', ar: 'فطيرة يقطين' }, level: 15, machine: 'Pie Oven', emoji: '🎃', img: 'https://hayday.fandom.com/wiki/Special:FilePath/Pumpkin_Pie.png' },
      { name: { en: 'Butter Popcorn', ar: 'فشار بالزبدة' }, level: 16, machine: 'Popcorn Pot', emoji: '🍿', img: 'https://hayday.fandom.com/wiki/Special:FilePath/Buttered_Popcorn.png' },
      { name: { en: 'Sweater', ar: 'سترة' }, level: 17, machine: 'Loom', emoji: '🧥', img: 'https://hayday.fandom.com/wiki/Special:FilePath/Sweater.png' }
    ];

    const officialImageBases = [
      'https://fankit.supercell.com',
      'https://store.supercell.com',
      'https://supercell.com'
    ];

    let currentMachineFilter = 'all';
    let uiVisible = true;
    let selection = {};
    let currentLang = 'ar';

    function el(id) {
      return document.getElementById(id);
    }

    function totalSelected() {
      return Object.values(selection).reduce((sum, value) => sum + value, 0);
    }

    function slugify(text) {
      return String(text).trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    function svgPlaceholder(label, emoji, bg = '#f8fafc', fg = '#111827') {
      const safeLabel = String(label).replace(/[&<>\"]/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;'
      }[char]));

      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" rx="18" fill="${bg}" /><text x="48" y="40" text-anchor="middle" font-size="30">${emoji}</text><text x="48" y="72" text-anchor="middle" font-size="10" font-family="Arial" fill="${fg}">${safeLabel}</text></svg>`;
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    function getOfficialImageCandidates(product) {
      const slug = slugify(product.name);
      return officialImageBases.map((base) => `${base}/images/hayday/${slug}.png`);
    }

    function getOfficialMachineCandidates(machine) {
      const slug = slugify(machine);
      return officialImageBases.map((base) => `${base}/images/hayday/machines/${slug}.png`);
    }

    function createImageWithOfficialFallback(candidates, alt, className, emoji) {
      const img = document.createElement('img');
      img.className = className;
      img.alt = alt;
      img.loading = 'lazy';
      img.decoding = 'async';
      img.referrerPolicy = 'no-referrer';
      img.dataset.index = '0';
      img.dataset.last = String(Math.max(0, candidates.length - 1));
      img.dataset.emoji = emoji || '📦';
      img.dataset.label = alt;

      img.onerror = function handleError() {
        const nextIndex = Number(img.dataset.index) + 1;
        if (nextIndex <= Number(img.dataset.last)) {
          img.dataset.index = String(nextIndex);
          img.src = candidates[nextIndex];
          return;
        }
        img.onerror = null;
        img.src = svgPlaceholder(img.dataset.label, img.dataset.emoji);
      };

      img.src = candidates[0] || svgPlaceholder(alt, emoji || '📦');
      return img;
    }

    const products = productData
      .map((item, index) => ({
        id: `prod_${index}`,
        name: item.name,
        lvl: item.level,
        machine: item.machine,
        emoji: item.emoji,
        imgCandidates: [item.img],
        machineCandidates: getOfficialMachineCandidates(item.machine)
      }))
      .sort((a, b) => a.lvl - b.lvl || a.name.localeCompare(b.name, 'en', { sensitivity: 'base' }));

    function generateMachineFilters() {
      const container = el('machines-container');
      container.innerHTML = '';
      const machines = ['all', ...new Set(products.map((p) => p.machine))];

      machines.forEach((machine) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `machine-filter-btn ${currentMachineFilter === machine ? 'active' : ''}`;
        btn.textContent = machine === 'all'
          ? (currentLang === 'ar' ? 'الكل' : 'All')
          : (machineTranslations[machine]?.[currentLang] || machine);
        btn.addEventListener('click', () => {
          currentMachineFilter = machine;
          generateMachineFilters();
          updateFilters();
        });
        container.appendChild(btn);
      });
    }

    function createProductCard(product) {
      const card = document.createElement('div');
      card.className = 'machine-card product-row';
      card.id = `row-${product.id}`;
      card.dataset.productId = product.id;
      card.dataset.lvl = String(product.lvl);
      card.dataset.machine = product.machine;
      card.dataset.name = (product.name.en + ' ' + product.name.ar).toLowerCase();

      const badge = document.createElement('div');
      badge.className = 'machine-badge';
      badge.title = machineTranslations[product.machine]?.[currentLang] || product.machine;
      badge.appendChild(createImageWithOfficialFallback(product.machineCandidates, product.machine, 'machine-badge-img', '⚙️'));
      card.appendChild(badge);

      const levelBadge = document.createElement('div');
      levelBadge.className = 'level-badge';
      levelBadge.textContent = `Lv ${product.lvl}`;
      card.appendChild(levelBadge);

      const imgWrap = document.createElement('div');
      imgWrap.className = 'product-img-container';
      imgWrap.appendChild(createImageWithOfficialFallback(product.imgCandidates, product.name.en, 'product-img', product.emoji));
      card.appendChild(imgWrap);

      const nameEl = document.createElement('div');
      nameEl.className = 'product-name';
      nameEl.textContent = product.name[currentLang];
      card.appendChild(nameEl);

      

      const qtyBox = document.createElement('div');
      qtyBox.className = 'qty-box';

      const minusBtn = document.createElement('button');
      minusBtn.type = 'button';
      minusBtn.className = 'product-qty-btn';
      minusBtn.textContent = '-';
      minusBtn.addEventListener('click', () => changeProductQty(product.id, -getCurrentStep()));

      const valueEl = document.createElement('span');
      valueEl.className = 'product-qty-value';
      valueEl.id = `qty-${product.id}`;
      valueEl.textContent = '0';

      const plusBtn = document.createElement('button');
      plusBtn.type = 'button';
      plusBtn.className = 'product-qty-btn';
      plusBtn.textContent = '+';
      plusBtn.addEventListener('click', () => changeProductQty(product.id, getCurrentStep()));

      qtyBox.appendChild(minusBtn);
      qtyBox.appendChild(valueEl);
      qtyBox.appendChild(plusBtn);
      card.appendChild(qtyBox);

      return card;
    }

    function renderGrid() {
      const grid = el('grid-container');
      grid.innerHTML = '';
      products.forEach((product) => grid.appendChild(createProductCard(product)));
      updateFilters();
      updateSummary();
    }

    function getCurrentStep() {
      return Number(el('step-qty').textContent) || 10;
    }

    function changeProductQty(productId, delta) {
      const current = selection[productId] || 0;
      selection[productId] = Math.max(0, current + delta);
      updateProductQty(productId);
    }

    function animateNumber(element, nextValue, duration = 220) {
      if (!element) return;

      const startValue = Number(element.dataset.value ?? element.textContent ?? 0) || 0;
      const endValue = Number(nextValue) || 0;

      if (startValue === endValue) {
        element.dataset.value = String(endValue);
        element.textContent = String(endValue);
        return;
      }

      if (element._countRaf) {
        cancelAnimationFrame(element._countRaf);
      }

      const startTime = performance.now();
      const easeOut = (t) => 1 - Math.pow(1 - t, 3);

      const tick = (now) => {
        const progress = Math.min(1, (now - startTime) / duration);
        const eased = easeOut(progress);
        const current = Math.round(startValue + (endValue - startValue) * eased);
        element.textContent = String(current);
        element.dataset.value = String(current);

        if (progress < 1) {
          element._countRaf = requestAnimationFrame(tick);
        } else {
          element.textContent = String(endValue);
          element.dataset.value = String(endValue);
          element._countRaf = null;
        }
      };

      element._countRaf = requestAnimationFrame(tick);
    }

    function updateProductQty(productId) {
      const qtyEl = el(`qty-${productId}`);
      if (qtyEl) {
        animateNumber(qtyEl, selection[productId] || 0, 180);
      }
      updateSummary();
    }

    function updateSummary() {
      const total = totalSelected();
      const target = Number(el('target-qty').value) || 0;
      animateNumber(el('current-total'), total, 260);
      animateNumber(el('target-display'), target, 220);
      el('progress-fill').style.width = target > 0 ? `${Math.min(100, (total / target) * 100)}%` : '0%';
      const hasSelection = total > 0;
      el('view-list-btn').classList.toggle('btn-disabled', !hasSelection);
      el('copy-code-btn').classList.toggle('btn-disabled', !hasSelection);
    }

    function updateFilters() {
      const minLvl = Number(el('min-lvl').value || 1);
      const maxLvl = Number(el('max-lvl').value || 30);
      const search = (el('product-search').value || '').trim().toLowerCase();

      document.querySelectorAll('.product-row').forEach((row) => {
        const lvl = Number(row.dataset.lvl || 0);
        const machineOk = currentMachineFilter === 'all' || row.dataset.machine === currentMachineFilter;
        const levelOk = lvl >= minLvl && lvl <= maxLvl;
        const searchOk = !search || row.dataset.name.includes(search);
        row.classList.toggle('row-hidden', !(machineOk && levelOk && searchOk));
      });
    }

    function getRowsForDistribution() {
      return el('distribute-scope').value === 'all'
        ? [...document.querySelectorAll('.product-row')]
        : [...document.querySelectorAll('.product-row:not(.row-hidden)')];
    }

    function distributeEvenly() {
      const rows = getRowsForDistribution();
      const target = Number(el('target-qty').value) || 0;
      if (!rows.length || !target) return;

      selection = {};
      const base = Math.floor(target / rows.length);
      let remainder = target % rows.length;

      rows.forEach((row) => {
        const productId = row.dataset.productId;
        selection[productId] = base + (remainder > 0 ? 1 : 0);
        if (remainder > 0) remainder -= 1;
      });

      products.forEach((product) => {
        const qtyEl = el(`qty-${product.id}`);
        if (qtyEl) {
          animateNumber(qtyEl, selection[product.id] || 0, 180);
        }
      });

      updateSummary();
    }

    function resetAll() {
      selection = {};
      products.forEach((product) => {
        const qtyEl = el(`qty-${product.id}`);
        if (qtyEl) {
          animateNumber(qtyEl, 0, 160);
        }
      });
      updateSummary();
    }

    function getSelectedProducts() {
      return products
        .filter((product) => (selection[product.id] || 0) > 0)
        .map((product) => ({ ...product, qty: selection[product.id] }));
    }

    function openSummaryModal() {
      const selected = getSelectedProducts();
      if (!selected.length) return;

      el('list-content').innerHTML = selected
        .map((item) => `<div class="flex items-center justify-between gap-3 p-2 rounded-xl bg-gray-50 text-black"><span>${item.name[currentLang]}</span><span>${item.qty}</span></div>`)
        .join('');

      el('product-count').textContent = String(selected.length);
      el('total-qty-modal').textContent = String(totalSelected());
      el('modal-badge-id').textContent = el('user-id').value || '#000';
      el('modal-overlay').classList.remove('hidden');
      el('modal-overlay').classList.add('flex');
    }

    function closeSummaryModal() {
      el('modal-overlay').classList.add('hidden');
      el('modal-overlay').classList.remove('flex');
    }

    function copyOrderCode() {
      const selected = getSelectedProducts();
      if (!selected.length) return;

      const badgeId = el('user-id').value || '#000';
      const lines = [`ID: ${badgeId}`].concat(selected.map((item) => `${item.name[currentLang]} x${item.qty}`));
      navigator.clipboard.writeText(lines.join('\n'));
    }

    function setStep(value) {
      const safe = Math.max(10, Math.min(100, value));
      animateNumber(el('step-qty'), safe, 160);
    }

    function toggleUI() {
      uiVisible = !uiVisible;
      el('header-collapsible').classList.toggle('ui-hide-content', !uiVisible);
    }

    function setupEvents() {
      el('product-search').addEventListener('input', updateFilters);
      el('min-lvl').addEventListener('input', updateFilters);
      el('max-lvl').addEventListener('input', updateFilters);
      el('target-qty').addEventListener('change', updateSummary);
      el('distribute-btn').addEventListener('click', distributeEvenly);
      el('reset-btn').addEventListener('click', resetAll);
      el('view-list-btn').addEventListener('click', openSummaryModal);
      el('copy-code-btn').addEventListener('click', copyOrderCode);
      el('close-modal-btn').addEventListener('click', closeSummaryModal);
      el('modal-overlay').addEventListener('click', closeSummaryModal);
      el('step-minus').addEventListener('click', () => setStep(getCurrentStep() - 10));
      el('step-plus').addEventListener('click', () => setStep(getCurrentStep() + 10));
      el('theme-btn').addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        el('moon-icon').classList.toggle('hidden');
        el('sun-icon').classList.toggle('hidden');
      });
      el('toggle-ui-btn').addEventListener('click', toggleUI);

      el('lang-btn').addEventListener('click', () => {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        document.body.classList.toggle('en-mode', currentLang === 'en');
        el('lang-btn').textContent = currentLang.toUpperCase();
        generateMachineFilters();
        renderGrid();
      });
    }

    function runBasicTests() {
      console.assert(products.length === 10, 'Should only show 10 sample products');
      console.assert(getCurrentStep() === 10, 'Default step should be 10');

      selection = { prod_0: 20, prod_1: 10 };
      console.assert(totalSelected() === 30, 'Total should match selected quantities');

      const joined = ['A', 'B'].join('\n');
      console.assert(joined === 'A\nB', 'Order code should join lines with newline');

      selection = {};
      console.assert(svgPlaceholder('Bread', '🍞').startsWith('data:image/svg+xml'), 'Placeholder should be a data URL');
    }

    generateMachineFilters();
    renderGrid();
    setupEvents();
    updateSummary();
    runBasicTests();
  </script>
</body>
</html>
