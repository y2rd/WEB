<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Y2rd Store - نموذج أولي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Droid+Arabic+Kufi:wght@400;700&family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --bg-body: #f8f9fa;
      --bg-card: #ffffff;
      --text-main: #111827;
      --border-color: #e5e7eb;
      --input-bg: #ffffff;
      --header-bg: rgba(255, 255, 255, 0.98);
      --primary: #6b7d73;
      --chip-bg: #f3f4f6;
    }

    body.dark-mode {
      --bg-body: #0f172a;
      --bg-card: #0f172a;
      --text-main: #ffffff;
      --border-color: #1e293b;
      --input-bg: #0f172a;
      --header-bg: rgba(15, 23, 42, 0.95);
      --primary: #94a3b8;
      --chip-bg: #1e293b;
      background: linear-gradient(180deg, #0f172a 0%, #020617 100%);
    }

    * {
      box-sizing: border-box;
      font-family: 'Tajawal', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif !important;
    }

    body.en-mode * {
      font-family: 'Droid Arabic Kufi', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif !important;
    }

    body {
      margin: 0;
      background: var(--bg-body);
      color: var(--text-main);
      font-weight: 800;
      padding-bottom: 120px;
    }

    .ui-hide-content { display: none !important; }
    .row-hidden { display: none !important; }

    header, footer {
      background: var(--header-bg);
      backdrop-filter: blur(10px);
    }

    main {
      background: transparent;
    }

    #lang-btn,
    #theme-btn {
      background: transparent !important;
      color: var(--text-main) !important;
      border: none !important;
    }

    body.dark-mode #lang-btn,
    body.dark-mode #theme-btn {
      background: transparent !important;
      color: #ffffff !important;
      border: none !important;
    }

    .top-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .top-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
      flex-shrink: 0;
    }

    .machines-carousel {
      position: relative;
      border-bottom: 1px solid var(--border-color);
      background: linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.5));
    }

    body.dark-mode .machines-carousel {
      background: linear-gradient(180deg, rgba(15,23,42,0.72), rgba(15,23,42,0.52));
    }

    .machines-carousel::before,
    .machines-carousel::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 34px;
      pointer-events: none;
      z-index: 2;
      transition: opacity 0.2s ease;
    }

    .machines-carousel::before {
      right: 0;
      background: linear-gradient(to left, var(--header-bg), rgba(255,255,255,0));
    }

    .machines-carousel::after {
      left: 0;
      background: linear-gradient(to right, var(--header-bg), rgba(255,255,255,0));
    }

    .machines-carousel.at-start::after,
    .machines-carousel.at-end::before {
      opacity: 0;
    }

    .machines-slider {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 40px;
      scrollbar-width: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      scroll-behavior: smooth;
      mask-image: linear-gradient(to left, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%);
      -webkit-mask-image: linear-gradient(to left, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%);
    }

    .machines-slider::-webkit-scrollbar { display: none; }

    .machines-slider.dragging {
      cursor: grabbing;
      scroll-behavior: auto;
    }

    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border: 1px solid rgba(107,125,115,0.16);
      border-radius: 999px;
      background: rgba(255,255,255,0.88);
      backdrop-filter: blur(10px);
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(15,23,42,0.12);
      transition: transform 0.16s ease, opacity 0.2s ease, background 0.2s ease;
    }

    .carousel-arrow:hover {
      transform: translateY(-50%) scale(1.04);
    }

    .carousel-arrow:disabled {
      opacity: 0.35;
      cursor: default;
      transform: translateY(-50%);
    }

    .carousel-arrow.right { right: 8px; }
    .carousel-arrow.left { left: 8px; }

    body.dark-mode .carousel-arrow {
      background: rgba(0,0,0,0.88);
      color: #ffffff;
      border-color: rgba(255,255,255,0.14);
      box-shadow: 0 8px 18px rgba(0,0,0,0.24);
    }

    .machine-filter-btn {
      flex: 0 0 auto;
      padding: 6px 12px;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      color: #111827;
      cursor: pointer;
      transition: 0.15s ease;
    }

    body.dark-mode .machine-filter-btn {
      background: #000000;
      color: #ffffff;
    }

    .machine-filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .compact-input {
      height: 32px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 10px;
      background: var(--input-bg);
      color: var(--text-main);
      outline: none;
      font-weight: 900;
      width: 100%;
      padding: 0 8px;
    }

    .qty-step-control {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--input-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      height: 32px;
    }

    .qty-step-btn,
    .product-qty-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      cursor: pointer;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .qty-step-btn { width: 38px; height: 100%; font-size: 20px; }
    .qty-step-btn:hover,
    .product-qty-btn:hover { transform: scale(1.05); }
    .qty-step-btn:active,
    .product-qty-btn:active { opacity: 0.55; }

    .qty-step-value {
      flex: 1;
      text-align: center;
      font-size: 11px;
      font-weight: 900;
      user-select: none;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      letter-spacing: 0.3px;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: end;
    }

    .control-block {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1 1 150px;
      min-width: 140px;
    }

    .control-block.id-block {
      flex: 1.15 1 170px;
      min-width: 160px;
    }

    .control-label {
      font-size: 10px;
      opacity: 0.7;
      font-weight: 900;
    }

    .settings-popover {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      width: 320px;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(107, 125, 115, 0.16);
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 44px rgba(15, 23, 42, 0.15);
      opacity: 0;
      transform: translateY(-6px) scale(0.98);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.22s ease;
      z-index: 145;
    }

    body.dark-mode .settings-popover {
      background: rgba(0, 0, 0, 0.94);
      border-color: rgba(255, 255, 255, 0.16);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.34);
    }

    .settings-popover.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .settings-popover::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 18px;
      width: 12px;
      height: 12px;
      background: inherit;
      border-left: 1px solid rgba(107, 125, 115, 0.18);
      border-top: 1px solid rgba(107, 125, 115, 0.18);
      transform: rotate(45deg);
    }

    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .settings-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .settings-field.full { grid-column: 1 / -1; }

    .settings-label {
      font-size: 10px;
      font-weight: 900;
      opacity: 0.72;
    }

    .settings-inline {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .settings-icon-btn {
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--primary);
      cursor: pointer;
      border-radius: 10px;
      transition: transform 0.15s ease, background 0.18s ease, color 0.18s ease;
    }

    .settings-icon-btn:hover {
      transform: translateY(-1px);
      background: rgba(107, 125, 115, 0.1);
    }

    .settings-icon-btn.active {
      background: rgba(107, 125, 115, 0.14);
      color: var(--primary);
    }

    .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .settings-title {
      font-size: 11px;
      font-weight: 900;
      color: var(--text-main);
    }

    .settings-subtitle {
      font-size: 9px;
      opacity: 0.65;
      margin-top: 2px;
    }

    .settings-stats-card {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(107,125,115,0.10), rgba(107,125,115,0.04));
      border: 1px solid rgba(107,125,115,0.14);
    }

    body.dark-mode .settings-stats-card {
      background: linear-gradient(135deg, rgba(148,163,184,0.12), rgba(148,163,184,0.04));
      border-color: rgba(148,163,184,0.18);
    }

    .settings-stats-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .settings-stats-label {
      font-size: 10px;
      font-weight: 900;
      opacity: 0.7;
    }

    .settings-stats-hint {
      font-size: 9px;
      opacity: 0.55;
    }

    .settings-stats-badge {
      min-width: 64px;
      padding: 8px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--primary), #7f9487);
      color: #fff;
      text-align: center;
      box-shadow: 0 8px 18px rgba(107,125,115,0.20);
      line-height: 1;
    }

    .settings-stats-value {
      font-size: 18px;
      font-weight: 900;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      letter-spacing: 0.4px;
      display: block;
    }

    .distribution-apply-btn {
      height: 34px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #7f9487);
      color: white;
      font-weight: 900;
      font-size: 11px;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(107, 125, 115, 0.22);
      transition: transform 0.16s ease, opacity 0.2s ease;
    }

    .distribution-apply-btn:hover { transform: translateY(-1px); }
    .distribution-apply-btn:active { opacity: 0.85; }

    .responsive-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .machine-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      min-height: 165px;
      position: relative;
      overflow: hidden;
    }

    .level-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 9px;
      font-weight: 900;
      padding: 3px 6px;
      border-radius: 999px;
      line-height: 1;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .product-img-container {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 4px;
      flex-shrink: 0;
      border-radius: 14px;
      overflow: hidden;
      background: transparent;
    }

    .product-img,
    .machine-badge-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: transparent;
    }

    .machine-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: rgba(255,255,255,0.96);
      border: 1px solid var(--border-color);
      overflow: hidden;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-name {
      width: 100%;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.2;
      text-align: center;
      margin-bottom: 6px;
      min-height: 28px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace !important;
      letter-spacing: 0.3px;
      font-variant-numeric: tabular-nums;
    }

    .qty-box {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2px;
      background: var(--input-bg);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .product-qty-btn {
      width: 32px;
      height: 30px;
      font-size: 16px;
      border-radius: 8px;
    }

    .product-qty-value {
      min-width: 34px;
      text-align: center;
      font-size: 12px;
      font-weight: 900;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
      letter-spacing: 0.3px;
    }

    .btn-disabled {
      opacity: 0.35 !important;
      pointer-events: none !important;
      filter: grayscale(1);
    }

    .copy-toast {
      position: fixed;
      left: 50%;
      bottom: 86px;
      transform: translateX(-50%) translateY(10px);
      padding: 10px 14px;
      border-radius: 14px;
      background: rgba(17, 24, 39, 0.94);
      color: #ffffff;
      font-size: 11px;
      font-weight: 900;
      box-shadow: 0 12px 28px rgba(0,0,0,0.2);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 400;
      white-space: nowrap;
    }

    .mobile-bottom-nav {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 210;
      display: none;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      padding: 8px;
      border-radius: 20px;
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(107,125,115,0.14);
      box-shadow: 0 18px 34px rgba(15,23,42,0.16);
      backdrop-filter: blur(14px);
    }

    body.dark-mode .mobile-bottom-nav {
      background: rgba(15,23,42,0.94);
      border-color: rgba(148,163,184,0.16);
      box-shadow: 0 18px 34px rgba(0,0,0,0.32);
    }

    .mobile-nav-btn {
      min-height: 54px;
      border: none;
      border-radius: 16px;
      background: transparent;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 9px;
      font-weight: 900;
      cursor: pointer;
      transition: transform 0.16s ease, background 0.18s ease, color 0.18s ease;
    }

    .mobile-nav-btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .mobile-nav-btn:hover {
      transform: translateY(-1px);
      background: rgba(107,125,115,0.08);
    }

    .mobile-nav-btn.active {
      background: linear-gradient(135deg, rgba(107,125,115,0.14), rgba(107,125,115,0.07));
      color: var(--primary);
    }

    .mobile-nav-badge {
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--primary), #7f9487);
      color: #fff;
      font-size: 9px;
      line-height: 18px;
      font-weight: 900;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
    }

    .copy-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .btn-bounce {
      animation: btnBounce 0.32s ease;
    }

    @keyframes btnBounce {
      0% { transform: scale(1); }
      40% { transform: scale(0.94); }
      100% { transform: scale(1); }
    }

    body.dark-mode #reset-btn,
    body.dark-mode #view-list-btn,
    body.dark-mode #copy-code-btn {
      background: #0f172a !important;
      color: #ffffff !important;
      border-color: #1e293b !important;
    }

    body.dark-mode #main-footer {
      background: rgba(15, 23, 42, 0.97) !important;
      border-top-color: #1e293b !important;
    }

    body.dark-mode #modal-content {
      background: #0f172a !important;
      color: #ffffff !important;
    }

    body.dark-mode #modal-badge-id {
      background: #1e293b !important;
      color: #ffffff !important;
    }

    body.dark-mode #list-content > div {
      background: #111827 !important;
      color: #ffffff !important;
    }

    body.dark-mode .border-t {
      border-color: #1e293b !important;
    }

    .progress-bar {
      height: 6px;
      border-radius: 999px;
      background: var(--border-color);
      overflow: hidden;
    }

    #progress-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.25s ease;
    }

    #toggle-ui-btn {
      position: fixed;
      left: 20px;
      bottom: 155px;
      z-index: 250;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.18);
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #toggle-ui-btn:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }

    #toggle-ui-btn svg {
      transition: opacity 0.2s ease, transform 0.25s ease;
    }

    #toggle-ui-btn .fade-out {
      opacity: 0;
      transform: scale(0.7);
    }

    #toggle-ui-btn .fade-in {
      opacity: 1;
      transform: scale(1);
    }

    body.ui-minimal #main-footer {
      left: 50%;
      right: auto;
      bottom: 12px;
      transform: translateX(-50%);
      width: auto;
      min-width: 220px;
      max-width: calc(100vw - 24px);
      padding: 8px 10px;
      border-radius: 18px;
      border: 1px solid rgba(107, 125, 115, 0.18);
      box-shadow: 0 16px 34px rgba(15, 23, 42, 0.16);
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(14px);
    }

    body.dark-mode.ui-minimal #main-footer {
      background: rgba(15, 23, 42, 0.94) !important;
      border-color: rgba(148, 163, 184, 0.18) !important;
      box-shadow: 0 16px 34px rgba(0, 0, 0, 0.30);
    }

    body.ui-minimal #footer-collapsible {
      display: none !important;
    }

    body.ui-minimal #main-footer .text-left {
      display: none !important;
    }

    body.ui-minimal #main-footer .summary-row {
      min-width: 200px;
      justify-content: center !important;
      gap: 10px !important;
    }

    body.ui-minimal #main-footer .progress-bar {
      min-width: 96px;
      flex: 0 0 96px;
    }

    body.ui-minimal #main-footer #current-total {
      font-size: 18px;
    }

    @media (max-width: 1024px) {
      .responsive-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    @media (max-width: 768px) {
      body {
        padding-bottom: 272px;
        -webkit-tap-highlight-color: transparent;
      }

      #toggle-ui-btn {
        left: 12px;
        bottom: 146px;
        width: 42px;
        height: 42px;
      }

      .top-toolbar {
        padding: 8px 10px;
        gap: 8px;
      }

      .top-brand {
        min-width: 0;
        gap: 7px;
      }

      .top-brand h1 {
        font-size: 11px !important;
        line-height: 1.15;
        max-width: 140px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

    function slugify(text) {
      return String(text).trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    function svgPlaceholder(label, emoji, bg = '#f8fafc', fg = '#111827') {
      const safeLabel = String(label).replace(/[&<>\"]/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;'
      }[char]));
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96"><rect width="96" height="96" rx="18" fill="${bg}" /><text x="48" y="40" text-anchor="middle" font-size="30">${emoji}</text><text x="48" y="72" text-anchor="middle" font-size="10" font-family="Arial" fill="${fg}">${safeLabel}</text></svg>`;
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    function getOfficialMachineCandidates(machine) {
      const slug = slugify(machine);
      return [
        `https://fankit.supercell.com/images/hayday/machines/${slug}.png`,
        `https://store.supercell.com/images/hayday/machines/${slug}.png`,
        `https://supercell.com/images/hayday/machines/${slug}.png`
      ];
    }

    function createImageWithOfficialFallback(candidates, alt, className, emoji) {
      const img = document.createElement('img');
      img.className = className;
      img.alt = alt;
      img.loading = 'lazy';
      img.decoding = 'async';
      img.referrerPolicy = 'no-referrer';
      img.dataset.index = '0';
      img.dataset.last = String(Math.max(0, candidates.length - 1));
      img.dataset.emoji = emoji || '📦';
      img.dataset.label = alt;
      img.onerror = function handleError() {
        const nextIndex = Number(img.dataset.index) + 1;
        if (nextIndex <= Number(img.dataset.last)) {
          img.dataset.index = String(nextIndex);
          img.src = candidates[nextIndex];
          return;
        }
        img.onerror = null;
        img.src = svgPlaceholder(img.dataset.label, img.dataset.emoji);
      };
      img.src = candidates[0] || svgPlaceholder(alt, emoji || '📦');
      return img;
    }

      .map((item, index) => {

          id: `prod_${index}`,

          machine: resolvedMachine,
          emoji: item.emoji,
          imgCandidates: [item.img],
          machineCandidates: getOfficialMachineCandidates(resolvedMachine)

      .sort((a, b) => a.lvl - b.lvl || a.name.en.localeCompare(b.name.en, 'en', { sensitivity: 'base' }));

        btn.textContent = machine === 'all'

    function getCurrentStep() {

    function animateNumber(element, nextValue, duration = 220) {
      if (!element) return;
      const startValue = Number(element.dataset.value ?? element.textContent ?? 0) || 0;
      const endValue = Number(nextValue) || 0;
      if (startValue === endValue) {
        element.dataset.value = String(endValue);
        element.textContent = String(endValue);
        return;
      }
      if (element._countRaf) cancelAnimationFrame(element._countRaf);
      const startTime = performance.now();
      const easeOut = (t) => 1 - Math.pow(1 - t, 3);
      const tick = (now) => {
        const progress = Math.min(1, (now - startTime) / duration);
        const eased = easeOut(progress);
        const current = Math.round(startValue + (endValue - startValue) * eased);
        element.textContent = String(current);
        element.dataset.value = String(current);
        if (progress < 1) {
          element._countRaf = requestAnimationFrame(tick);
        } else {
          element.textContent = String(endValue);
          element.dataset.value = String(endValue);
          element._countRaf = null;
        }
      };
      element._countRaf = requestAnimationFrame(tick);
    }

    function changeProductQty(productId, delta) {
      const current = selection[productId] || 0;
      selection[productId] = Math.max(0, current + delta);
      updateProductQty(productId);
    }

    function updateProductQty(productId) {
      const qtyEl = el(`qty-${productId}`);
      if (qtyEl) animateNumber(qtyEl, selection[productId] || 0, 180);
      updateSummary();
    }

    function updateSummary() {
      const total = totalSelected();
      const target = Number(el('target-qty').value) || 0;
      const hasBadgeId = !!(el('user-id')?.value || '').trim();
      animateNumber(el('current-total'), total, 260);
      animateNumber(el('target-display'), target, 220);
      animateNumber(el('mobile-selected-count'), Object.values(selection).filter((value) => value > 0).length, 220);
      el('progress-fill').style.width = target > 0 ? `${Math.min(100, (total / target) * 100)}%` : '0%';
      const canUseActions = total > 0 && hasBadgeId;
      el('view-list-btn').classList.toggle('btn-disabled', !canUseActions);
      el('copy-code-btn').classList.toggle('btn-disabled', !canUseActions);
      syncMobileNavState();
    }

    function updateSettingsStats() {
      animateNumber(el('settings-products-count'), products.length, 240);

    function countOtherProducts() {
      return products.filter((product) => product.machine === 'Other').length;
    }

    function updateFilters() {
      const minLvl = Number(el('min-lvl').value || 1);
      const maxLvl = Number(el('max-lvl').value || 150);
      const search = (el('product-search').value || '').trim().toLowerCase();
      document.querySelectorAll('.product-row').forEach((row) => {
        const lvl = Number(row.dataset.lvl || 0);
        const machineOk = currentMachineFilter === 'all' || row.dataset.machine === currentMachineFilter;
        const levelOk = lvl >= minLvl && lvl <= maxLvl;
        const searchOk = !search || row.dataset.name.includes(search);
        row.classList.toggle('row-hidden', !(machineOk && levelOk && searchOk));
      });
    }

    function getRowsForDistribution() {
      return el('distribute-scope').value === 'all'
        ? [...document.querySelectorAll('.product-row')]
        : [...document.querySelectorAll('.product-row:not(.row-hidden)')];
    }

    function distributeEvenly() {
      const rows = getRowsForDistribution();
      const target = Number(el('target-qty').value) || 0;
      if (!rows.length || !target) return;
      selection = {};
      const base = Math.floor(target / rows.length);
      let remainder = target % rows.length;
      rows.forEach((row) => {
        const productId = row.dataset.productId;
        selection[productId] = base + (remainder > 0 ? 1 : 0);
        if (remainder > 0) remainder -= 1;
      });
      products.forEach((product) => {
        const qtyEl = el(`qty-${product.id}`);
        if (qtyEl) animateNumber(qtyEl, selection[product.id] || 0, 180);
      });
      updateSummary();
    }

    function resetAll() {
      selection = {};
      products.forEach((product) => {
        const qtyEl = el(`qty-${product.id}`);
        if (qtyEl) animateNumber(qtyEl, 0, 160);
      });
      updateSummary();
    }

    function getSelectedProducts() {
      return products.filter((product) => (selection[product.id] || 0) > 0).map((product) => ({ ...product, qty: selection[product.id] }));
    }

      const toast = el('copy-toast');

      toastTimer = setTimeout(() => {

    async function copyOrderCode() {
      const badgeId = (el('user-id')?.value || '').trim();
      if (!badgeId) {
        showToast('اكتب البطاقة التعريفية أولًا');
        pulseButton('copy-code-btn');
        return;
      }
      const selected = getSelectedProducts();
      if (!selected.length) {
        showToast('اختر منتجًا واحدًا على الأقل');
        pulseButton('copy-code-btn');
        return;
      }

      const productLines = selected.map((item) => `${item.name.en.toLowerCase()}=${item.qty}`);
      const totalQty = totalSelected();
      const text = [...productLines, '', '', badgeId, String(totalQty)].join('\n');

      let copied = false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          copied = true;
        }
      } catch (e) {
        copied = false;
      }

      if (!copied) {
        try {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.top = '0';
          textarea.style.left = '0';
          textarea.style.width = '1px';
          textarea.style.height = '1px';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          copied = document.execCommand('copy');
          document.body.removeChild(textarea);
        } catch (e) {
          copied = false;
        }
      }

      if (copied) {
        pulseButton('copy-code-btn');
        showToast('تم نسخ الطلب');
      } else {
        window.prompt('انسخ الطلب يدويًا:', text);
        showToast('انسخ الطلب يدويًا');
      }
    }

    function setStep(value) {
      const safe = Math.max(10, Math.min(100, value));

    function toggleUI() {
      uiVisible = !uiVisible;
      el('header-collapsible').classList.toggle('ui-hide-content', !uiVisible);
      el('footer-collapsible').classList.toggle('ui-hide-content', !uiVisible);
      document.body.classList.toggle('ui-minimal', !uiVisible);

      const openIcon = el('eye-open-icon');
      const closedIcon = el('eye-closed-icon');
      if (uiVisible) {
        closedIcon.classList.add('fade-out');
        setTimeout(() => {
          closedIcon.classList.add('hidden');
          closedIcon.classList.remove('fade-out');
          openIcon.classList.remove('hidden');
          openIcon.classList.add('fade-in');
          setTimeout(() => openIcon.classList.remove('fade-in'), 200);
        }, 120);
      } else {
        openIcon.classList.add('fade-out');
        setTimeout(() => {
          openIcon.classList.add('hidden');
          openIcon.classList.remove('fade-out');
          closedIcon.classList.remove('hidden');
          closedIcon.classList.add('fade-in');
          setTimeout(() => closedIcon.classList.remove('fade-in'), 200);
        }, 120);
      }
      closeSettingsPopover();
    }

    function openSettingsPopover() {
      const popover = el('settings-popover');

      toggle.setAttribute('aria-expanded', 'true');

    function closeSettingsPopover() {
      const popover = el('settings-popover');
      const toggle = el('settings-toggle-btn');
      if (!popover || !toggle) return;
      popover.classList.remove('open');
      toggle.classList.remove('active');
      toggle.setAttribute('aria-expanded', 'false');
    }

    function toggleSettingsPopover(event) {
      if (event) event.stopPropagation();
      const popover = el('settings-popover');
      if (popover.classList.contains('open')) {
        closeSettingsPopover();
      } else {
        openSettingsPopover();
      }
    }

    function syncMachinesCarouselState() {
      const slider = el('machines-container');
      const shell = el('machines-carousel');
      const prev = el('machines-prev');
      const next = el('machines-next');
      if (!slider || !shell || !prev || !next) return;
      const maxScroll = slider.scrollWidth - slider.clientWidth;
      const atStart = slider.scrollLeft <= 4;
      const atEnd = slider.scrollLeft >= maxScroll - 4;
      shell.classList.toggle('at-start', atStart);
      shell.classList.toggle('at-end', atEnd);
      prev.disabled = atStart;
      next.disabled = atEnd;
    }

    function scrollMachinesBy(direction) {
      const slider = el('machines-container');
      if (!slider) return;
      slider.scrollBy({ left: direction * 180, behavior: 'smooth' });
    }

      openSettingsPopover();
      setTimeout(() => {

    function setActiveMobileNav(target) {
      ['mobile-nav-search', 'mobile-nav-machines', 'mobile-nav-summary', 'mobile-nav-selected'].forEach((id) => {
        el(id)?.classList.toggle('active', id === target);
      });
    }

    function syncMobileNavState() {
      const searchHasValue = !!(el('product-search')?.value || '').trim();
      const hasSelected = Object.values(selection).some((value) => value > 0);
      if (searchHasValue) {
        setActiveMobileNav('mobile-nav-search');
        return;
      }
      if (hasSelected) {
        setActiveMobileNav('mobile-nav-selected');
        return;
      }
      setActiveMobileNav('mobile-nav-machines');
    }

    function scrollToMachines() {
      el('machines-carousel')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      setActiveMobileNav('mobile-nav-machines');
    }

    function scrollToSummary() {
      el('main-footer')?.scrollIntoView({ behavior: 'smooth', block: 'end' });
      setActiveMobileNav('mobile-nav-summary');
    }

    function focusSelectedOnly() {
      const firstSelected = products.find((product) => (selection[product.id] || 0) > 0);
      if (firstSelected) {
        el(`row-${firstSelected.id}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        el('main-footer')?.scrollIntoView({ behavior: 'smooth', block: 'end' });
      }
      setActiveMobileNav('mobile-nav-selected');
    }

    function syncMobileTools() {
      const isMobile = window.innerWidth <= 768;
      el('mobile-search-btn')?.classList.toggle('hidden', !isMobile);
    }

    function setupEvents() {
      el('user-id').addEventListener('input', updateSummary);
      el('product-search').addEventListener('input', () => {
        updateFilters();
        syncMobileNavState();
      });
      el('min-lvl').addEventListener('input', updateFilters);
      el('max-lvl').addEventListener('input', updateFilters);
      el('target-qty').addEventListener('change', updateSummary);
      el('distribute-btn').addEventListener('click', () => {
        distributeEvenly();
        closeSettingsPopover();
      });
      el('settings-toggle-btn').addEventListener('click', toggleSettingsPopover);
      el('settings-close-btn').addEventListener('click', closeSettingsPopover);
      el('reset-btn').addEventListener('click', resetAll);
      el('view-list-btn').addEventListener('click', openSummaryModal);
      el('copy-code-btn').addEventListener('click', copyOrderCode);
      el('close-modal-btn').addEventListener('click', closeSummaryModal);
      el('modal-overlay').addEventListener('click', closeSummaryModal);
      el('step-minus').addEventListener('click', () => setStep(getCurrentStep() - 10));
      el('step-plus').addEventListener('click', () => setStep(getCurrentStep() + 10));
      el('mobile-search-btn')?.addEventListener('click', focusMobileSearch);
      el('mobile-nav-search')?.addEventListener('click', focusMobileSearch);
      el('mobile-nav-machines')?.addEventListener('click', scrollToMachines);
      el('mobile-nav-summary')?.addEventListener('click', scrollToSummary);
      el('mobile-nav-selected')?.addEventListener('click', focusSelectedOnly);
      el('theme-btn').addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        el('moon-icon').classList.toggle('hidden');
        el('sun-icon').classList.toggle('hidden');
      });
      el('toggle-ui-btn').addEventListener('click', toggleUI);

      document.addEventListener('click', (event) => {
        const settingsPopover = el('settings-popover');
        const settingsToggle = el('settings-toggle-btn');
        if (!settingsPopover || !settingsToggle) return;
        const clickedSettings = settingsPopover.contains(event.target) || settingsToggle.contains(event.target);
        if (!clickedSettings) closeSettingsPopover();
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') closeSettingsPopover();
      });

      el('lang-btn').addEventListener('click', () => {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        document.body.classList.toggle('en-mode', currentLang === 'en');
        el('lang-btn').textContent = currentLang.toUpperCase();
        generateMachineFilters();
        renderGrid();
        syncMachinesCarouselState();
      });

      const machines = el('machines-container');
      let isDown = false;
      let startX = 0;
      let scrollLeft = 0;
      machines.addEventListener('pointerdown', (event) => {
        isDown = true;
        startX = event.clientX;
        scrollLeft = machines.scrollLeft;
        machines.classList.add('dragging');
      });
      window.addEventListener('pointerup', () => {
        isDown = false;
        machines.classList.remove('dragging');
      });
      machines.addEventListener('pointerleave', () => {
        isDown = false;
        machines.classList.remove('dragging');
      });
      machines.addEventListener('pointermove', (event) => {
        if (!isDown) return;
        const walk = event.clientX - startX;
        machines.scrollLeft = scrollLeft - walk;
      });
      machines.addEventListener('scroll', syncMachinesCarouselState, { passive: true });
      window.addEventListener('resize', () => {
        syncMachinesCarouselState();
        syncMobileTools();
      });
      el('machines-prev').addEventListener('click', () => scrollMachinesBy(-1));
      el('machines-next').addEventListener('click', () => scrollMachinesBy(1));
    }

    function runBasicTests() {
      console.assert(Array.isArray(INFERRED_MACHINE_RULES), 'Machine inference rules should be an array');
      console.assert(INFERRED_MACHINE_RULES.every((rule) => Array.isArray(rule) && rule.length === 2 && rule[0] instanceof RegExp && typeof rule[1] === 'string'), 'Every machine inference rule should be a [RegExp, string] tuple');
      console.assert(products.length >= 202, 'Should load the large product list plus butter and cream');
      console.assert(getCurrentStep() === 10, 'Default step should be 10');
      selection = { prod_0: 20, prod_1: 10 };
      console.assert(totalSelected() === 30, 'Total should match selected quantities');
      const joined = ['A', 'B'].join('\n');
      console.assert(joined === 'A\nB', 'Order code should join lines with newline');
      const orderPreview = ['cream=50', '', '', 'abc123', '50'].join('\n');
      console.assert(orderPreview.includes('cream=50'), 'Copied text format should include english product names');
      console.assert(orderPreview.endsWith('50'), 'Copied text format should end with total qty');
      console.assert(resolveMachine({ name: { en: 'Chocolate Popcorn' }, machine: 'Other' }) === 'Popcorn Pot', 'Popcorn rule should work');
      console.assert(resolveMachine({ name: { en: 'Lemon Tea' }, machine: 'Other' }) === 'Tea Stand', 'Tea rule should work');
      console.assert(resolveMachine({ name: { en: 'Berry Smoothie' }, machine: 'Other' }) === 'Smoothie Maker', 'Smoothie rule should work');
      console.assert(resolveMachine({ name: { en: 'Fish and Chips' }, machine: 'Other' }) === 'Deep Fryer', 'Specific override should work');
      console.assert(countOtherProducts() === 0, 'No products should remain in Other');
      el('user-id').value = '';
      updateSummary();
      console.assert(el('view-list-btn').classList.contains('btn-disabled'), 'Summary button should stay disabled without badge id');
      console.assert(el('copy-code-btn').classList.contains('btn-disabled'), 'Copy button should stay disabled without badge id');
      //el('user-id').value = '123';
      updateSummary();
      selection = {};
      console.assert(svgPlaceholder('Bread', '🍞').startsWith('data:image/svg+xml'), 'Placeholder should be a data URL');
      console.assert(!!el('settings-toggle-btn'), 'Settings toggle button should exist');
      console.assert(!!el('machines-container'), 'Machines container should exist');
      console.assert(!!el('machines-carousel'), 'Machines carousel shell should exist');
      console.assert(!!el('machines-prev') && !!el('machines-next'), 'Carousel arrows should exist');
      console.assert(!!el('copy-toast'), 'Copy toast should exist');
      console.assert(!!el('mobile-search-btn'), 'Mobile search button should exist');
      console.assert(!!el('mobile-bottom-nav'), 'Mobile bottom nav should exist');
      console.assert(!!el('mobile-nav-summary'), 'Mobile summary nav button should exist');
      console.assert(!!el('settings-products-count'), 'Settings products count should exist');
      console.assert(Number(el('settings-products-count').textContent || '0') >= 200, 'Settings count should be populated');
      document.body.classList.remove('ui-minimal');
    }

    generateMachineFilters();
    renderGrid();
    syncMobileTools();
    setupEvents();
    updateSummary();
    syncMachinesCarouselState();
    runBasicTests();
  </script>
</body>
</html>
